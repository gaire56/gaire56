<svg xmlns="http://www.w3.org/2000/svg" width="960" height="252" viewBox="0 0 960 252" role="img" aria-labelledby="title description">
  <title id="title">Hi, I’m Ananta Gaire</title>
  <desc id="description">Machine Learning Developer and Assistant Professor at KCGI in Kyoto, Japan. A neural-network illustration animates beside the greeting.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .greeting { animation: arrive .9s cubic-bezier(.2,.8,.2,1) both; }
      .role { animation: arrive .85s cubic-bezier(.2,.8,.2,1) .2s both; }
      .affiliation { animation: arrive .8s cubic-bezier(.2,.8,.2,1) .36s both; }
      .signal { animation: lightup 2.7s ease-in-out .25s both; }
      .trace { animation: follow 2.3s ease-out .25s both; }
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes lightup { 0% { opacity: .18; } 46% { opacity: 1; } 100% { opacity: .88; } }
    @keyframes follow { from { stroke-dasharray: 330; stroke-dashoffset: 330; } to { stroke-dasharray: 330; stroke-dashoffset: 0; } }
  </style>
  <defs>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#0b1525"/><stop offset="1" stop-color="#172c43"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#72efcd"/><stop offset="1" stop-color="#91b8ff"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#92afce" opacity=".18"/>
    </pattern>
    <linearGradient id="grid-fade"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".66" stop-color="#fff"/></linearGradient>
    <mask id="fade"><rect width="960" height="252" fill="url(#grid-fade)"/></mask>
  </defs>
  <rect x="1" y="1" width="958" height="250" rx="23" fill="url(#panel)" stroke="#375470"/>
  <rect x="2" y="2" width="956" height="248" rx="22" fill="url(#grid)" mask="url(#fade)"/>
  <path d="M57 52h38" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text class="greeting" x="54" y="111" fill="#f5f9ff" font-size="58" font-weight="750" letter-spacing="-2">Hi, I’m Ananta Gaire</text>
    <text class="role" x="57" y="158" fill="#87ead3" font-size="30" font-weight="650">Machine Learning Developer</text>
    <text class="affiliation" x="58" y="193" fill="#b3c9df" font-size="21">Assistant Professor at KCGI · Kyoto, Japan</text>
  </g>
  <g fill="none" stroke="#537691" stroke-width="1.5" opacity=".78">
    <path d="M674 78L757 53M674 78L757 151M674 122L757 53M674 122L757 151M674 166L757 103M674 166L757 202M757 53L840 88M757 103L840 88M757 103L840 166M757 151L840 88M757 151L840 166M757 202L840 166M840 88L905 127M840 166L905 127"/>
  </g>
  <path class="trace" d="M674 166L757 103L840 166L905 127" fill="none" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round"/>
  <g fill="#1c344c" stroke="#7296b0" stroke-width="2">
    <circle cx="674" cy="78" r="5"/><circle cx="674" cy="122" r="5"/>
    <circle cx="757" cy="53" r="5"/><circle cx="757" cy="151" r="5"/><circle cx="757" cy="202" r="5"/>
    <circle cx="840" cy="88" r="6"/>
  </g>
  <g class="signal" fill="url(#accent)" stroke="#172b42" stroke-width="2">
    <circle cx="674" cy="166" r="6"/><circle cx="757" cy="103" r="7"/>
    <circle cx="840" cy="166" r="7"/><circle cx="905" cy="127" r="9"/>
  </g>
  <circle class="signal" cx="905" cy="127" r="17" fill="none" stroke="#91b8ff" stroke-opacity=".48"/>
</svg>
